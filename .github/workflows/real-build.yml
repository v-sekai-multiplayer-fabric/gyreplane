name: real build (stock clang, full link)

# Plan step 1 of the "close out zone-server-h2o" plan: everything in
# this repo so far was verified by clang -fsyntax-only against real
# vendored headers, or by standalone unit tests compiled without the
# full dependency set. NONE of it has gone through a real cmake --build
# linking the actual h2o, libfdb_c, picoquic, picotls, mujoco together --
# that is a real, open risk (ODR clashes, symbol collisions, FDB API
# version mismatches), not a formality. This job closes that gap.
#
# Stock clang, not Fil-C: the Fil-C FFI boundary against these
# not-Fil-C-compiled libraries is still unconfirmed (see
# build-filc.yml's own TODO) -- proving a stock build works first avoids
# conflating two unverified things in one job. Fil-C linkage is tracked
# separately.
#
# Scope: build + link + run test/unit/*.c for real. Does NOT stand up a
# live FDB cluster or run a live WebTransport client against the
# binary -- that is plan steps 3/4 (deployment + verification), a
# separate, larger piece of work.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  H2O_VERSION: "ccea64b17ade832753db933658047ede9f31a380" # same commit h2o-bench-tpcc pinned
  FDB_VERSION: "7.3.79" # same version h2o-bench-tpcc's Dockerfile installed
  MBEDTLS_VERSION: "mbedtls-3.6.7" # see the "Build mbedtls" step for why this is vendored, not apt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -qqy \
            cmake gcc g++ libssl-dev pkg-config curl libbrotli-dev git libyajl-dev

      - name: Cache built mbedtls
        id: cache-mbedtls
        uses: actions/cache@v4
        with:
          path: /opt/mbedtls
          key: mbedtls-${{ env.MBEDTLS_VERSION }}-ubuntu

      # Ubuntu's apt libmbedtls-dev does not ship mbedtls_config.h --
      # confirmed by the first real build run: picoquic's mbedtls glue
      # (picoquic_mbedtls.c, ptls_mbedtls.c) needs it and picotls.c had
      # type conflicts against whatever apt version was actually present.
      # The Godot fork this project mirrors vendors mbedtls from source
      # too (godot/thirdparty/mbedtls, confirmed by reading its
      # include/mbedtls/mbedtls_config.h directly) rather than relying on
      # a system package -- same fix here, a recent mbedtls 3.6.x LTS tag
      # built from source, not the exact same commit Godot vendors (that
      # copy has no version-pin metadata to read), but the same *reason*.
      - name: Build mbedtls
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${MBEDTLS_VERSION}" --recurse-submodules \
            https://github.com/Mbed-TLS/mbedtls.git /tmp/mbedtls-build
          cmake -B /tmp/mbedtls-build/build -S /tmp/mbedtls-build \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/mbedtls
          cmake --build /tmp/mbedtls-build/build -j
          cmake --install /tmp/mbedtls-build/build

      - name: Cache built h2o
        id: cache-h2o
        uses: actions/cache@v4
        with:
          path: /opt/h2o
          key: h2o-${{ env.H2O_VERSION }}-ubuntu

      - name: Build h2o (evloop)
        if: steps.cache-h2o.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/h2o-build && cd /tmp/h2o-build
          curl -LSs "https://github.com/h2o/h2o/archive/${H2O_VERSION}.tar.gz" | \
            tar --strip-components=1 -xz
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_MRUBY=off \
            -DCMAKE_INSTALL_PREFIX=/opt/h2o -S .
          cmake --build build -j
          cmake --install build

      - name: Install FoundationDB client + server
        run: |
          curl -LSs "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb" -o /tmp/fdb-client.deb
          curl -LSs "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-server_${FDB_VERSION}-1_amd64.deb" -o /tmp/fdb-server.deb
          sudo dpkg -i /tmp/fdb-client.deb /tmp/fdb-server.deb || sudo apt-get install -f -qqy
          rm /tmp/fdb-*.deb

      - name: Configure CMake (h2o + FDB + mbedtls on the search path)
        run: |
          export PKG_CONFIG_PATH="/opt/mbedtls/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -B build \
            -DCMAKE_PREFIX_PATH="/opt/h2o;/opt/mbedtls" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # This is the real link this whole workflow exists to prove out --
      # expect and fix whatever surfaces here, per the plan's own risk
      # list: MuJoCo's Threads dependency, picotls/mujoco/FDB transitive
      # symbol collisions, FDB API version mismatches.
      - name: Build zone-server-h2o
        run: cmake --build build -j

      - name: Run every test/unit/*.c against the real linked libraries
        run: |
          for t in test/unit/test_*.c; do
            name=$(basename "$t" .c)
            echo "=== $name ==="
            case "$name" in
              test_xr_grid_entity_packet)
                clang -Wall -Wextra -std=c11 -Isrc/gen \
                  src/gen/xr_grid_entity_packet.c "$t" -o "/tmp/$name" ;;
              test_vel_to_um_per_tick)
                clang -Wall -Wextra -std=c11 "$t" -o "/tmp/$name" ;;
              test_rebac)
                clang -Wall -Wextra -std=c11 -Isrc/gen src/gen/rebac.c "$t" -o "/tmp/$name" ;;
              test_zf_kv_multi_zone)
                clang -Wall -Wextra -std=c11 -Isrc -Isrc/gen \
                  src/zf_kv.c src/gen/xr_grid_entity_packet.c "$t" -o "/tmp/$name" ;;
              test_sinew_align)
                clang -Wall -Wextra -std=c11 -Isrc/gen -lm src/gen/sinew_align.c "$t" -o "/tmp/$name" ;;
              test_mj_physics_freefall)
                # The one test never actually run before this workflow --
                # real link against the real built mujoco target.
                clang -Wall -Wextra -std=c11 -Isrc/physics -Ithirdparty/mujoco/include \
                  src/physics/mj_physics.c "$t" \
                  -Lbuild/mujoco-build/lib -lmujoco -lm -o "/tmp/$name"
                export LD_LIBRARY_PATH="$PWD/build/mujoco-build/lib:$LD_LIBRARY_PATH" ;;
              *)
                echo "no build recipe for $name -- add one rather than skip silently"
                exit 1 ;;
            esac
            "/tmp/$name"
          done
