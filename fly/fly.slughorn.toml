app            = "slughorn"
primary_region = "iad"

# The SlugHorn 3D MUD demo, deployed so the three.js/SlugHorn page can be
# checked by hand in a real browser against a real server.
#
# Same Hobby-plan-safe shape as fly/fly.toml's throwaway test app:
# shared-cpu-1x, 256mb, no dedicated IPv4 (that is a separate paid
# feature, not part of the free allowance). Consequences, stated plainly
# rather than papered over:
#
#  - No UDP service is declared at all. fly.toml's own comment already
#    notes that without a dedicated IPv4, external UDP reachability
#    cannot be proven from outside the VM -- so the zone processes here
#    still bind their UDP sockets, but nothing external is mapped to
#    them. What this app is for is the TCP MUD HTTP surface.
#  - FDB_PROCESS_COUNT/ZONE_COUNT stay at 1, matching the test app: this
#    is a demo of the web UI, not a throughput topology.
#  - This app is IPv6-only. mud/web/test/mud.spec.ts's own comment
#    records the real consequence: Chromium's built-in resolver can fail
#    on an IPv6-only hostname that curl resolves instantly, in which case
#    navigate to the bracketed IPv6 literal instead.

[build]
  dockerfile = "fly/Containerfile"

[env]
  ZONE_PORT         = "7443"
  FDB_PROCESS_COUNT = "1"
  ZONE_COUNT        = "1"
  MUD_HTTP_PORT     = "8080"

[[services]]
  internal_port        = 8080
  protocol             = "tcp"
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  # MUD website (text UI + the three.js/SlugHorn 3D view), JSON API and
  # SSE stream. No TLS cert is provided in this env (TLS_CERT/TLS_KEY
  # unset), so mud_http_listen() serves plain HTTP -- real, per
  # src/mud/mud_http.c's own documented fallback.
  [[services.ports]]
    port = 80
    handlers = ["http"]

  # Kept as plain defense in depth, no longer covering for a known bug.
  # It was added when the first POST /api/mud/command reliably killed
  # this deploy; that turned out to be a real double-free (a callback
  # destroying an FDBFuture that fdb_database.c's future_callback()
  # already owns) and is fixed properly in src/mud/mud_http.c rather
  # than restarted around. Worth keeping anyway: when zone-server-h2o
  # dies, the machine itself does NOT exit, because entrypoint.sh's
  # `wait` is still holding the surviving fdbserver children -- so
  # without a check here a dead listener would leave the VM "started"
  # while serving nothing.
  [[services.tcp_checks]]
    interval = "15s"
    timeout  = "5s"
    grace_period = "60s"

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
